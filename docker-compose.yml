services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: video-player-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    command: sh -c "cd frontend && npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true